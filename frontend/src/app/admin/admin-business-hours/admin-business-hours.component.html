<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/shop/{{ slug }}"></ion-back-button>
    </ion-buttons>
    <ion-title>Orari di Apertura</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ion-padding" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Caricamento impostazioni...</p>
  </div>

  <div class="ion-padding" *ngIf="error">
    <ion-text color="danger">
      <h3>Errore</h3>
      <p>{{ error }}</p>
    </ion-text>
    <ion-button (click)="loadTenant()">Riprova</ion-button>
  </div>

  <div *ngIf="!isLoading && !error && tenant">
    <ion-list>
      <ion-list-header>
        <ion-label>Configurazione Settimanale</ion-label>
      </ion-list-header>

      <ion-card *ngFor="let day of businessHours">
        <ion-item lines="none">
          <ion-label>
            <h2>{{ getLabelForDay(day.dayOfWeek) }}</h2>
            <p *ngIf="!day.isOpen" color="medium">Chiuso</p>
            <p *ngIf="day.isOpen" color="success">Aperto</p>
          </ion-label>
          <ion-toggle slot="end" [(ngModel)]="day.isOpen" color="primary"></ion-toggle>
        </ion-item>

        <ion-card-content *ngIf="day.isOpen">
          <div class="times-container">
            <div class="time-block">
              <ion-label color="medium" position="stacked">Apertura</ion-label>
              <div class="datetime-wrapper">
                <ion-datetime presentation="time" [(ngModel)]="day.openTime" locale="it-IT"></ion-datetime>
              </div>
            </div>
            
            <div class="time-separator">
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </div>
            
            <div class="time-block">
              <ion-label color="medium" position="stacked">Chiusura</ion-label>
              <div class="datetime-wrapper">
                <ion-datetime presentation="time" [(ngModel)]="day.closeTime" locale="it-IT"></ion-datetime>
              </div>
            </div>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-list>
  </div>
</ion-content>

<ion-footer *ngIf="!isLoading && !error && tenant">
  <ion-toolbar>
    <ion-button expand="block" (click)="save()" [disabled]="isSaving" class="ion-margin">
      <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
      <span *ngIf="!isSaving">Salva Orari</span>
    </ion-button>
  </ion-toolbar>
</ion-footer>
