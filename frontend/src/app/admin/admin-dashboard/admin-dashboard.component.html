<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Dashboard Amministrativa</ion-title>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/booking', slug]">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
  <ion-toolbar *ngIf="tenant">
    <ion-segment [value]="activeSegment" (ionChange)="segmentChanged($event)">
      <ion-segment-button value="bookings">
        <ion-label>Prenotazioni</ion-label>
      </ion-segment-button>
      <ion-segment-button value="settings">
        <ion-label>Impostazioni</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ion-padding" *ngIf="isLoading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Caricamento dashboard...</p>
  </div>

  <div class="ion-padding" *ngIf="error">
    <ion-text color="danger">
      <h3>Errore</h3>
      <p>{{ error }}</p>
    </ion-text>
  </div>

  <div *ngIf="!isLoading && !error && tenant">
    <div [ngSwitch]="activeSegment">
      <app-admin-bookings *ngSwitchCase="'bookings'" [tenant]="tenant"></app-admin-bookings>
      <app-admin-settings *ngSwitchCase="'settings'" [tenant]="tenant"></app-admin-settings>
    </div>
  </div>
</ion-content>
