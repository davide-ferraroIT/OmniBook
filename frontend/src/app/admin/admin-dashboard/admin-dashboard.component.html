<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Dashboard Amministrativa</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/profile">
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  @if (tenant) {
    <ion-toolbar>
      <ion-segment [value]="activeSegment" (ionChange)="segmentChanged($event)">
        <ion-segment-button value="bookings">
          <ion-label>Prenotazioni</ion-label>
        </ion-segment-button>
        <ion-segment-button value="settings">
          <ion-label>Impostazioni</ion-label>
        </ion-segment-button>
      </ion-segment>
    </ion-toolbar>
  }
</ion-header>

<ion-content>
  @if (isLoading) {
    <div class="ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Caricamento dashboard...</p>
    </div>
  }

  @if (error) {
    <div class="ion-padding">
      <ion-text color="danger">
        <h3>Errore</h3>
        <p>{{ error }}</p>
      </ion-text>
    </div>
  }

  @if (!isLoading && !error && tenant) {
    <div
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
      style="height: 100%;">
      <div>
        @switch (activeSegment) {
          @case ('bookings') {
            <app-admin-bookings [tenant]="tenant"></app-admin-bookings>
          }
          @case ('settings') {
            <app-admin-settings [tenant]="tenant"></app-admin-settings>
          }
        }
      </div>
    </div>
  }
</ion-content>
