<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="cancel()">Annulla</ion-button>
    </ion-buttons>
    <ion-title>{{ resource ? 'Modifica Risorsa' : 'Nuova Risorsa' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [strong]="true" [disabled]="!name.trim() || capacity < 1 || isSaving || isUploadingImage">
        <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
        <span *ngIf="!isSaving">Salva</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input label="Nome della risorsa" labelPlacement="floating" [(ngModel)]="name" type="text" placeholder="es. Poltrona 1"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-top">
      <ion-input label="Capacità (persone servibili contemporaneamente)" labelPlacement="floating" [(ngModel)]="capacity" type="number" min="1"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-top" lines="none">
      <ion-label>
        <h2>Immagine Risorsa</h2>
        <p>Carica un'immagine per questa risorsa</p>
      </ion-label>
    </ion-item>
    
    <div class="ion-padding-horizontal">
      <div class="flex items-center space-x-4 mb-4">
        <div class="w-16 h-16 bg-gray-800 rounded-full overflow-hidden border border-gray-600 flex-shrink-0 relative">
           <img *ngIf="imageUrl" [src]="imageUrl" alt="Preview" class="w-full h-full object-cover">
           <ion-icon *ngIf="!imageUrl" name="cube-outline" class="text-3xl text-gray-500 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></ion-icon>
           
           <div *ngIf="isUploadingImage" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
             <ion-spinner name="crescent" color="light"></ion-spinner>
           </div>
        </div>
        
        <div class="flex-1 flex space-x-2">
          <input type="file" id="resourceFileInput" accept="image/*" class="hidden" (change)="onFileSelected($event)">
          <ion-button fill="outline" color="primary" onclick="document.getElementById('resourceFileInput').click()" [disabled]="isUploadingImage">
            {{ imageUrl ? 'Cambia' : 'Carica Immagine' }}
          </ion-button>
          <ion-button *ngIf="imageUrl" fill="clear" color="danger" (click)="removeImage()" [disabled]="isUploadingImage">
            Rimuovi
          </ion-button>
        </div>
      </div>
    </div>
  </ion-list>
</ion-content>
