<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="medium" (click)="cancel()">Annulla</ion-button>
    </ion-buttons>
    <ion-title>{{ service ? 'Modifica Servizio' : 'Nuovo Servizio' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [strong]="true" [disabled]="!name.trim() || isSaving">
        <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
        <span *ngIf="!isSaving">Salva</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input label="Nome del servizio" labelPlacement="floating" [(ngModel)]="name" type="text" placeholder="es. Taglio Capelli"></ion-input>
    </ion-item>

    <ion-item class="ion-margin-top">
      <ion-select label="Risorse Abilitate" labelPlacement="floating" multiple="true" [(ngModel)]="selectedResourceIds" name="resources" okText="Conferma" cancelText="Annulla">
        <ion-select-option *ngFor="let res of resources" [value]="res.id">{{ res.name }}</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item class="ion-margin-top" lines="none">
      <ion-label>
        <h2>Immagine Servizio</h2>
        <p>Carica un'immagine per questo servizio</p>
      </ion-label>
    </ion-item>
    
    <div class="ion-padding-horizontal">
      <div class="flex items-center space-x-4 mb-4">
        <div class="w-16 h-16 bg-gray-800 rounded-full overflow-hidden border border-gray-600 flex-shrink-0 relative">
           <img *ngIf="imageUrl" [src]="imageUrl" alt="Preview" class="w-full h-full object-cover">
           <ion-icon *ngIf="!imageUrl" name="image-outline" class="text-3xl text-gray-500 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></ion-icon>
           
           <!-- Overlay di caricamento -->
           <div *ngIf="isUploadingImage" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
             <ion-spinner name="crescent" color="light"></ion-spinner>
           </div>
        </div>
        
        <div class="flex-1">
          <input type="file" id="fileInput" accept="image/*" class="hidden" (change)="onFileSelected($event)">
          <ion-button fill="outline" color="primary" onclick="document.getElementById('fileInput').click()" [disabled]="isUploadingImage">
            {{ imageUrl ? 'Cambia Immagine' : 'Carica Immagine' }}
          </ion-button>
        </div>
      </div>
    </div>

    <ion-item class="ion-margin-top" lines="none">
      <ion-label>
        <h2>Durata</h2>
        <p>Seleziona ore e minuti necessari per questo servizio.</p>
      </ion-label>
    </ion-item>
    
    <!-- L'utente voleva l'orologio come le sveglie: presentation="time" in ion-datetime -->
    <div class="datetime-container ion-margin-bottom">
      <ion-datetime presentation="time" [(ngModel)]="durationTime" locale="it-IT"></ion-datetime>
    </div>
  </ion-list>
</ion-content>
