<ion-header>
  <ion-toolbar>
    <ion-title>Registrazione</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="flex flex-col items-center justify-center h-full">
    <h1 class="text-3xl font-bold mb-8 text-primary">Crea Account</h1>
    
    <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
      <ion-item>
        <ion-label position="floating">Nome</ion-label>
        <ion-input type="text" [(ngModel)]="firstName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Cognome</ion-label>
        <ion-input type="text" [(ngModel)]="lastName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" [(ngModel)]="password"></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="error">
        <p class="mt-2">{{ error }}</p>
      </ion-text>

      <ion-button expand="block" class="mt-6" (click)="onRegister()" [disabled]="loading || !firstName || !lastName || !email || !password || password.length < 6">
        {{ loading ? 'Registrazione in corso...' : 'Registrati' }}
      </ion-button>
      
      <div class="mt-4 text-center text-gray-600">
        <p>Hai già un account? <a routerLink="/login">Accedi</a></p>
      </div>
    </div>
  </div>
</ion-content>
